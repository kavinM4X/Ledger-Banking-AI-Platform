<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Banking AI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAEDF1;
    --panel:#FFFFFF;
    --ink:#16233D;
    --ink-soft:#5B6478;
    --accent:#2F4B8C;
    --accent-deep:#1C3160;
    --accent-soft:#E1E7F5;
    --gold:#B9852F;
    --gold-soft:#F3E7D1;
    --red:#B23B3B;
    --red-soft:#F6E3E1;
    --amber:#C98A2C;
    --amber-soft:#F7EAD4;
    --green:#3E7A56;
    --green-soft:#E3EFE7;
    --line:#D7DCE3;
    --mono:'IBM Plex Mono',monospace;
    --display:'Fraunces',serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);}
  #app{min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--body);cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  /* ---------- Ticker ---------- */
  .ticker{
    background:var(--accent-deep);
    color:#DCE4F5;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    padding:6px 20px;
    display:flex;
    justify-content:space-between;
    text-transform:uppercase;
  }
  .ticker span.dim{opacity:.55;}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:calc(100vh - 27px);}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--accent-deep);color:#fff;
    display:flex;flex-direction:column;padding:26px 0 20px;
  }
  .brand{padding:0 22px 22px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand .mark{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:.01em;}
  .brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;opacity:.55;margin-top:3px;text-transform:uppercase;}
  .navgroup{padding:0 12px;flex:1;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;
    font-size:13.5px;font-weight:500;color:#C7D1EA;margin-bottom:2px;transition:background .15s;
  }
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navitem.active{background:#fff;color:var(--accent-deep);}
  .navitem .ic{font-size:15px;width:18px;text-align:center;}
  .sidebar-foot{padding:14px 12px 0;border-top:1px solid rgba(255,255,255,.12);margin-top:10px;}

  .main{flex:1;padding:30px 36px 60px;max-width:1180px;}
  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-family:var(--display);font-size:26px;font-weight:600;margin:0 0 4px;}
  .pagehead p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .crumb{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}

  /* ---------- Cards ---------- */
  .grid{display:grid;gap:16px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.4fr 1fr;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;
  }
  .stat .label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .stat .value{font-family:var(--display);font-size:26px;font-weight:600;margin-top:6px;}
  .stat .delta{font-size:11.5px;margin-top:4px;color:var(--green);}
  .stat .delta.down{color:var(--red);}

  .card h3{font-family:var(--display);font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}

  /* ---------- Stamps (signature element) ---------- */
  .stamp{
    display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
    padding:3px 9px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(-1.2deg);
    text-transform:uppercase;white-space:nowrap;
  }
  .stamp.high{color:var(--red);background:var(--red-soft);}
  .stamp.medium{color:var(--amber);background:var(--amber-soft);}
  .stamp.low{color:var(--green);background:var(--green-soft);}
  .stamp.info{color:var(--accent);background:var(--accent-soft);}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:8px 10px;border-bottom:1.5px solid var(--line);}
  td{padding:11px 10px;border-bottom:1px solid var(--line);}
  tr.rowlink{cursor:pointer;transition:background .1s;}
  tr.rowlink:hover{background:var(--accent-soft);}
  .num{font-family:var(--mono);}

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--accent);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:13px;font-weight:600;
  }
  .btn:hover{background:var(--accent-deep);}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
  .btn.ghost:hover{background:var(--accent-soft);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:default;}

  /* ---------- Login ---------- */
  .loginwrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      linear-gradient(var(--accent-deep),var(--accent-deep)),
      repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 26px);
  }
  .loginbox{background:var(--panel);border-radius:12px;padding:40px 40px 32px;width:380px;box-shadow:0 30px 60px rgba(10,20,45,.35);}
  .loginbox .mark{font-family:var(--display);font-size:28px;font-weight:700;text-align:center;color:var(--accent-deep);}
  .loginbox .tag{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:4px 0 26px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:14px;font-family:var(--body);}
  .field input:focus{outline:none;border-color:var(--accent);}
  .roletoggle{display:flex;gap:8px;margin-bottom:18px;}
  .roletoggle button{flex:1;padding:10px;border-radius:7px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .roletoggle button.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep);}
  .loginbox .btn{width:100%;padding:11px;font-size:14px;margin-top:4px;}
  .loginfoot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:16px;}

  /* ---------- Chat / FAQ ---------- */
  .chatwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:560px;display:flex;flex-direction:column;}
  .chatlog{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:76%;padding:11px 14px;border-radius:10px;font-size:13.5px;line-height:1.55;}
  .msg.bot{background:var(--accent-soft);color:var(--accent-deep);align-self:flex-start;border-bottom-left-radius:3px;}
  .msg.user{background:var(--accent-deep);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
  .msg .src{display:block;margin-top:8px;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.65;}
  .chatinput{display:flex;gap:10px;padding:16px;border-top:1px solid var(--line);}
  .chatinput input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:13.5px;}
  .chatinput input:focus{outline:none;border-color:var(--accent);}
  .suggest{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px;}
  .suggest button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;color:var(--ink-soft);}
  .suggest button:hover{border-color:var(--accent);color:var(--accent);}
  .typing span{display:inline-block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin-right:3px;animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

  /* ---------- Charts ---------- */
  .donutwrap{display:flex;align-items:center;gap:20px;}
  .donut{width:130px;height:130px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut::after{content:'';position:absolute;inset:22px;background:var(--panel);border-radius:50%;}
  .legend{flex:1;font-size:12.5px;}
  .legend .li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);}
  .legend .li .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;}
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
  .bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .bar .fill{width:60%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .4s;}
  .bars .bar .lbl{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-top:6px;}

  /* ---------- Misc ---------- */
  .badgebar{display:flex;gap:10px;margin-bottom:18px;}
  .badgebar .b{flex:1;padding:12px 14px;border-radius:8px;font-family:var(--mono);font-size:12px;text-align:center;font-weight:600;}
  .searchrow{display:flex;gap:10px;margin-bottom:16px;}
  .searchrow input{flex:1;padding:10px 14px;border:1.5px solid var(--line);border-radius:7px;font-size:13.5px;}
  .searchrow select{padding:10px 12px;border:1.5px solid var(--line);border-radius:7px;font-size:13px;background:#fff;}
  .aibox{border:1.5px solid var(--accent-soft);background:linear-gradient(180deg,#fff,var(--accent-soft) 220%);border-radius:10px;padding:18px 20px;}
  .aibox .tag{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .aibox p{font-size:13.5px;line-height:1.65;margin:0;color:var(--ink);}
  .skel{background:linear-gradient(90deg,var(--line) 25%,#eef1f5 37%,var(--line) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:4px;height:12px;margin:6px 0;}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
  .backlink{font-size:12.5px;color:var(--accent);margin-bottom:14px;display:inline-block;}
  .profilewrap{max-width:480px;}
  .prow{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .prow .k{color:var(--ink-soft);}
  textarea.scriptbox{width:100%;min-height:150px;font-family:var(--body);font-size:13.5px;line-height:1.65;border:1px solid var(--line);border-radius:8px;padding:14px;resize:vertical;background:#fdfdfc;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   BANKING AI PLATFORM — demo prototype
   Mock data + real Claude API calls power F1–F4 features
   ========================================================= */

const CATS = ["Food","Bills","Shopping","Travel","Others"];
const CAT_COLORS = {Food:"#2F4B8C", Bills:"#B9852F", Shopping:"#3E7A56", Travel:"#B23B3B", Others:"#8891A6"};

function seedRand(seed){ let s = seed; return () => { s = (s*9301+49297)%233280; return s/233280; }; }

function buildCustomers(){
  const names = ["Arun Kumar","Priya Sundaram","Rahul Menon","Kavin S","Divya R","Suresh Babu","Meera Iyer",
    "Karthik V","Anjali Nair","Vikram Rao","Lakshmi P","Sanjay Gupta"];
  const kyc = ["Verified","Verified","Pending","Verified","Verified","Pending","Verified","Verified","Pending","Verified","Verified","Verified"];
  const accType = ["Savings","Current","Savings","Savings","Current","Savings","Savings","Current","Savings","Savings","Current","Savings"];
  const overdue = [62,45,30,0,0,18,0,52,0,10,0,38];
  const loan = [85000,42000,20000,0,15000,31000,0,67000,0,9000,0,28000];
  const suspicious = [false,false,true,false,false,false,false,false,true,false,false,false];

  return names.map((name,i)=>{
    const rnd = seedRand(i*17+3);
    let priority = "LOW";
    const kycIssue = kyc[i]==="Pending";
    if(overdue[i] > 45 || kycIssue) priority = "HIGH";
    else if(overdue[i] >= 15 || suspicious[i]) priority = "MEDIUM";

    const issues = [];
    if(overdue[i]>0) issues.push(`Loan overdue: ${overdue[i]} days`);
    if(kycIssue) issues.push("KYC verification required");
    if(suspicious[i]) issues.push("Unusual transaction pattern");
    if(issues.length===0) issues.push("Account in good standing");

    // transactions
    const txns = [];
    const dates = ["Aug 10","Aug 09","Aug 07","Aug 05","Aug 02","Aug 01","Jul 29","Jul 25","Jul 20","Jul 14","Jul 08","Jul 01"];
    for(let t=0;t<12;t++){
      const cat = CATS[Math.floor(rnd()*CATS.length)];
      const amt = Math.round((rnd()*3500+200));
      txns.push({cat, amt, date: dates[t], dir:"debit"});
    }
    txns.push({cat:"Salary", amt: 40000+Math.round(rnd()*15000), date:"Aug 01", dir:"credit"});

    const catTotals = {};
    CATS.forEach(c=>catTotals[c]=0);
    txns.filter(t=>t.dir==="debit").forEach(t=>catTotals[t.cat]+=t.amt);
    const totalSpend = Object.values(catTotals).reduce((a,b)=>a+b,0);

    const monthly = [0.78,0.85,0.72,0.95,1.0,0.88].map(f=>Math.round(totalSpend*f*(0.85+rnd()*0.3)));

    return {
      id: "CUST"+(1000+i*7),
      name, phone: "98"+String(400000000+i*13579).slice(0,8),
      kyc: kyc[i], accountType: accType[i],
      balance: 40000+Math.round(rnd()*90000),
      savings: 5000+Math.round(rnd()*20000),
      loanAmount: loan[i], overdueDays: overdue[i], dueDate: overdue[i]>0 ? "Jun 10" : "—",
      priority, issues, suspicious: suspicious[i], kycIssue,
      transactions: txns, catTotals, totalSpend, monthly
    };
  });
}

const FAQS = [
  {title:"Personal Loan Documents", keys:["loan","document","documents","apply","personal"],
   body:"To apply for a personal loan, customers need identity proof (Aadhaar or PAN), address proof (utility bill or passport), and income proof — the latest 3 months' salary slips for salaried applicants or ITR for self-employed applicants."},
  {title:"Loan Prepayment & Foreclosure", keys:["prepay","foreclosure","close","early","prepayment"],
   body:"Loans can be foreclosed any time after 6 EMIs. A prepayment charge of 2% on the outstanding principal applies for fixed-rate loans; floating-rate personal loans carry no prepayment penalty."},
  {title:"Credit Card Eligibility", keys:["credit","card","eligibility","apply","income"],
   body:"Credit card eligibility requires a minimum monthly income of ₹25,000, an existing relationship of 6+ months, and a credit score above 700. Pre-approved offers are available for salary account holders."},
  {title:"KYC Update Process", keys:["kyc","update","verification","documents","re-kyc"],
   body:"KYC can be updated via the mobile app under Profile > KYC Update, by uploading a photo ID and address proof, or by visiting any branch with original documents for in-person verification."},
  {title:"Fixed Deposit Interest Rates", keys:["fd","fixed","deposit","interest","rate"],
   body:"Fixed deposits currently offer 6.5% p.a. for tenures of 1–3 years and 7.1% p.a. for senior citizens on the same tenure, with premature withdrawal subject to a 1% rate reduction."},
  {title:"Loan Overdue Penalty", keys:["overdue","penalty","late","fee","missed"],
   body:"A late payment fee of 2% on the overdue EMI amount is charged after a 3-day grace period, along with additional interest accrual on the outstanding balance until payment is received."},
  {title:"Account Statement Download", keys:["statement","download","passbook","history"],
   body:"Account statements can be downloaded as PDF or CSV from the app under Accounts > Statements, for any date range up to the last 3 years, and are also emailed monthly by default."}
];

function retrieveFAQ(query){
  const q = query.toLowerCase();
  let best = null, bestScore = 0;
  FAQS.forEach(f=>{
    let score = 0;
    f.keys.forEach(k=>{ if(q.includes(k)) score += 2; });
    f.title.toLowerCase().split(" ").forEach(w=>{ if(w.length>3 && q.includes(w)) score += 1; });
    if(score > bestScore){ bestScore = score; best = f; }
  });
  return best || FAQS[0];
}

async function callClaude(systemPrompt, userPrompt){
  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === "text");
    return textBlock ? textBlock.text.trim() : "I couldn't generate a response just now.";
  }catch(err){
    console.error("Claude API error:", err);
    return "AI service is temporarily unavailable — please try again.";
  }
}

/* ---------------- App State ---------------- */
const state = {
  role: "customer", // "customer" | "rm"
  page: "login",
  customers: buildCustomers(),
  activeCustomerId: null,
  chat: [{who:"bot", text:"Hi, I'm your Banking AI Assistant. Ask me about loans, cards, KYC, deposits or your account.", src:null}],
  chatBusy: false,
  briefText: null, briefLoading: false,
  spendBriefCache: {}, spendBriefLoading: false,
  scriptCache: {}, scriptLoading: false,
  userName: "Kavin"
};

function stampClass(p){ return p==="HIGH"?"high":p==="MEDIUM"?"medium":"low"; }
function money(n){ return "₹"+n.toLocaleString("en-IN"); }
function getCustomer(id){ return state.customers.find(c=>c.id===id); }
function topAttention(){
  const order = {HIGH:0,MEDIUM:1,LOW:2};
  return [...state.customers].sort((a,b)=> order[a.priority]-order[b.priority] || b.overdueDays-a.overdueDays).slice(0,5);
}

function go(page, custId){
  state.page = page;
  if(custId) state.activeCustomerId = custId;
  render();
  window.scrollTo(0,0);
}

/* ---------------- Shell ---------------- */
function navItems(){
  if(state.role==="customer"){
    return [
      ["customerDashboard","🏠","Dashboard"],
      ["spendingAnalytics","📊","Spending Analytics"],
      ["faqAI","🤖","AI Assistant"],
      ["settings","⚙️","Settings"]
    ];
  }
  return [
    ["rmDashboard","🏠","Morning Brief"],
    ["customerList","👥","Customers"],
    ["collections","📞","Collections"],
    ["settings","⚙️","Settings"]
  ];
}

function shell(inner){
  const today = new Date().toLocaleDateString("en-IN",{weekday:'long', year:'numeric', month:'short', day:'numeric'});
  const nav = navItems().map(([p,ic,label])=>{
    const activeSet = (p==="customerList" && (state.page==="customerDetails"||state.page==="callScript")) || (p==="collections" && state.page==="collections") || p===state.page;
    return `<div class="navitem ${activeSet?'active':''}" onclick="go('${p}')"><span class="ic">${ic}</span>${label}</div>`;
  }).join("");

  return `
  <div class="ticker">
    <span>BRANCH 04 · LEDGER LIVE · ${today.toUpperCase()}</span>
    <span class="dim">${state.role==="customer"?"CUSTOMER PORTAL":"RM PORTAL"}</span>
  </div>
  <div class="shell">
    <div class="sidebar">
      <div class="brand"><div class="mark">Ledger</div><div class="sub">Banking AI Platform</div></div>
      <div class="navgroup">${nav}</div>
      <div class="sidebar-foot">
        <div class="navitem" onclick="doLogout()"><span class="ic">🚪</span>Logout</div>
      </div>
    </div>
    <div class="main">${inner}</div>
  </div>`;
}

function doLogout(){ state.page="login"; state.activeCustomerId=null; render(); }

/* ---------------- LOGIN ---------------- */
function renderLogin(){
  return `
  <div class="loginwrap">
    <div class="loginbox">
      <div class="mark">🏦 Ledger</div>
      <div class="tag">Intelligent Banking Platform</div>
      <div class="roletoggle">
        <button class="${state.role==='customer'?'active':''}" onclick="setRole('customer')">Customer</button>
        <button class="${state.role==='rm'?'active':''}" onclick="setRole('rm')">Relationship Manager</button>
      </div>
      <div class="field"><label>Email</label><input type="text" value="${state.role==='customer'?'kavin.s@ledger.bank':'rm.kavin@ledger.bank'}" /></div>
      <div class="field"><label>Password</label><input type="password" value="••••••••" /></div>
      <button class="btn" onclick="doLogin()">Login</button>
      <div class="loginfoot">Forgot password? · Demo credentials pre-filled</div>
      <div class="loginfoot">New here? <a style="color:var(--accent);font-weight:600;" onclick="go('register')">Create an account</a></div>
    </div>
  </div>`;
}
function setRole(r){ state.role = r; render(); }
function doLogin(){
  state.page = state.role==="customer" ? "customerDashboard" : "rmDashboard";
  render();
}

/* ---------------- REGISTER ---------------- */
function renderRegister(){
  return `
  <div class="loginwrap">
    <div class="loginbox">
      <div class="mark">🏦 Ledger</div>
      <div class="tag">Create Your Account</div>
      <div class="roletoggle">
        <button class="${state.role==='customer'?'active':''}" onclick="setRole('customer')">Customer</button>
        <button class="${state.role==='rm'?'active':''}" onclick="setRole('rm')">Relationship Manager</button>
      </div>
      <div class="field"><label>Full Name</label><input id="regName" type="text" placeholder="e.g. Kavin S" /></div>
      <div class="field"><label>Email</label><input id="regEmail" type="text" placeholder="you@ledger.bank" /></div>

async function genSpendBrief(custId){
  const c = getCustomer(custId);
  state.spendBriefLoading = true; render();
  const catLines = CATS.map(cat=>`${cat}: ₹${c.catTotals[cat]} (${(c.catTotals[cat]/c.totalSpend*100).toFixed(1)}%)`).join(", ");
  const sys = "You are a banking assistant writing a short, warm, plain-language monthly spending brief for a retail banking customer inside their app. Keep it to 2-3 sentences. Be specific using the numbers given. No markdown, no headers.";
  const user = `Customer total spend this month: ₹${c.totalSpend}. Category breakdown: ${catLines}. Last month's total was roughly ${Math.round(c.totalSpend*0.89)}. Write the brief.`;
  const text = await callClaude(sys, user);
  state.spendBriefCache[custId] = text;
  state.spendBriefLoading = false;
  render();
}

/* ---------------- FAQ AI (F3) ---------------- */
function renderFAQ(){
  return shell(`
    <div class="pagehead"><h1>Product AI Assistant</h1><p>Ask about loans, accounts, cards, deposits and more.</p></div>
    <div class="chatwrap">
      <div class="chatlog" id="chatlog">
        ${state.chat.map(m=>`
          <div class="msg ${m.who}">${m.text}${m.src?`<span class="src">Source: ${m.src}</span>`:''}</div>
        `).join("")}
        ${state.chatBusy ? `<div class="msg bot"><span class="typing"><span></span><span></span><span></span></span></div>` : ''}
      </div>
      <div class="suggest">
        <button onclick="askFAQ('What documents are required for a personal loan?')">Loan documents?</button>
        <button onclick="askFAQ('What is the FD interest rate?')">FD rates?</button>
        <button onclick="askFAQ('How do I update my KYC?')">Update KYC?</button>
        <button onclick="askFAQ('What happens if I miss an EMI payment?')">Missed EMI?</button>
      </div>
      <div class="chatinput">
        <input id="chatInput" type="text" placeholder="Ask about loans, accounts, cards..." onkeydown="if(event.key==='Enter')sendChat()" />
        <button class="btn" onclick="sendChat()" ${state.chatBusy?'disabled':''}>Send</button>
      </div>
    </div>
  `);
}
function sendChat(){
  const input = document.getElementById("chatInput");
  const val = input.value.trim();
  if(!val || state.chatBusy) return;
  askFAQ(val);
}
async function askFAQ(question){
  if(state.chatBusy) return;
  state.chat.push({who:"user", text: question, src:null});
  state.chatBusy = true;
  render();
  const scrollBox = document.getElementById("chatlog");
  if(scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;

  const match = retrieveFAQ(question);
  const sys = "You are Ledger's banking product assistant. Answer the customer's question using ONLY the FAQ content provided below — do not invent policy details. Keep the answer to 1-3 sentences, direct and friendly, no markdown.\n\nFAQ CONTENT:\n" + match.title + ": " + match.body;
  const answer = await callClaude(sys, question);

  state.chat.push({who:"bot", text: answer, src: match.title});
  state.chatBusy = false;
  render();
  const box = document.getElementById("chatlog");
  if(box) box.scrollTop = box.scrollHeight;
  const inp = document.getElementById("chatInput");
  if(inp) inp.value = "";
}

/* ---------------- CALL SCRIPT (F1) ---------------- */
function renderCallScript(){
  const c = getCustomer(state.activeCustomerId) || state.customers[0];
  const cached = state.scriptCache[c.id];
  if(!cached && !state.scriptLoading){ genCallScript(c.id); }

  return shell(`
    <a class="backlink" onclick="go('customerDetails','${c.id}')">← ${c.name}</a>
    <div class="pagehead"><h1>AI Collection Assistant</h1></div>
    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card stat"><div class="label">Customer</div><div class="value" style="font-size:18px;">${c.name}</div></div>
      <div class="card stat"><div class="label">Overdue</div><div class="value">${c.overdueDays} Days</div></div>
      <div class="card stat"><div class="label">Outstanding</div><div class="value">${money(c.loanAmount)}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>🤖 Generated Call Script</h3>
      ${cached ? `<textarea class="scriptbox" id="scriptTextArea">${cached.script}</textarea>` :
        `<div class="skel" style="width:96%"></div><div class="skel" style="width:90%"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div>`}
      <div style="margin-top:12px;display:flex;gap:10px;">
        <button class="btn ghost sm" onclick="copyScript()">Copy Script</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>AI Recommended Action</h3>
      ${cached ? `
        <div style="margin-bottom:8px;"><span class="stamp ${stampClass(c.priority)}">${c.priority} PRIORITY</span></div>
        <p style="font-size:13.5px;line-height:1.6;margin:0;">${cached.action}</p>
      ` : `<div class="skel" style="width:70%"></div>`}
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn ghost" onclick="genCallScript('${c.id}', true)">Regenerate</button>
      <button class="btn" onclick="go('customerDetails','${c.id}')">Mark as Contacted</button>
    </div>
  `);
}
function copyScript(){
  const ta = document.getElementById("scriptTextArea");
  if(ta){ ta.select(); document.execCommand("copy"); }
}
async function genCallScript(custId, force){
  const c = getCustomer(custId);
  if(state.scriptCache[custId] && !force) return;
  state.scriptLoading = true;
  if(force){ delete state.scriptCache[custId]; render(); }
  const sys = "You are an AI assistant generating a polite, professional loan-collection phone call script for a bank Relationship Manager to read to a customer. Also output a short recommended next action. Respond ONLY as strict JSON with two keys: \"script\" (a 3-5 sentence spoken script, first-person as the RM, no markdown) and \"action\" (1-2 sentences recommending what the RM should do next). No preamble, no markdown fences.";
  const user = `Customer: ${c.name}. Outstanding amount: ₹${c.loanAmount}. Overdue: ${c.overdueDays} days. Priority: ${c.priority}. Flags: ${c.issues.join(", ")}.`;
  const raw = await callClaude(sys, user);
  let parsed;
  try{
    const clean = raw.replace(/```json|```/g,"").trim();
    parsed = JSON.parse(clean);
  }catch(e){
    parsed = { script: raw, action: "Contact the customer at the earliest opportunity and document the outcome." };
  }
  state.scriptCache[custId] = parsed;
  state.scriptLoading = false;
  render();
}

/* ---------------- Router / Render ---------------- */
function render(){
  const app = document.getElementById("app");
  switch(state.page){
    case "login": app.innerHTML = renderLogin(); break;
    case "register": app.innerHTML = renderRegister(); break;
    case "customerDashboard": app.innerHTML = renderCustomerDashboard(); break;
    case "spendingAnalytics": app.innerHTML = renderSpendingAnalytics(); break;
    case "faqAI": app.innerHTML = renderFAQ(); break;
    case "rmDashboard": app.innerHTML = renderRMDashboard(); break;
    case "customerList": app.innerHTML = renderCustomerList(); break;
    case "customerDetails": app.innerHTML = renderCustomerDetails(); break;
    case "callScript": app.innerHTML = renderCallScript(); break;
    case "collections": app.innerHTML = renderCollections(); break;
    case "settings": app.innerHTML = renderSettings(); break;
    default: app.innerHTML = renderLogin();
  }
}
